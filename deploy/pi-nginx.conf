geo $realip_remote_addr $svs_laravel_proxy_allowed {
    default 0;
    127.0.0.1 1;
    192.168.2.105 1;
}

server {
    listen 127.0.0.1:8092 default_server;
    listen 192.168.3.157:8092 default_server;
    server_name _;
    return 404;
}

server {
    listen 127.0.0.1:8092;
    listen 192.168.3.157:8092;
    if ($svs_laravel_proxy_allowed = 0) { return 403; }
    server_name dev.clubunio.com;
    return 308 https://dev.clubunio.ch$request_uri;
}

server {
    listen 127.0.0.1:8092;
    listen 192.168.3.157:8092;
    if ($svs_laravel_proxy_allowed = 0) { return 403; }
    server_name dev-my2.svsissach.ch dev.clubunio.ch;
    root /var/www/svs-laravel/current/public;
    index index.php;
    client_max_body_size 10m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param REMOTE_ADDR $realip_remote_addr;
        fastcgi_pass unix:/run/php/svs-laravel.sock;
        fastcgi_read_timeout 120;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
