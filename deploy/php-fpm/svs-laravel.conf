[svs-laravel]
user = www-data
group = www-data
listen = /run/php/svs-laravel.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
; Keep a small warm pool; cap concurrency rather than raising per-request memory.
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500
php_admin_value[memory_limit] = 256M
; Native endpoints retain their smaller per-file/type limits.
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 40M
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
security.limit_extensions = .php
